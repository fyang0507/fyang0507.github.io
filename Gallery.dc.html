<script>
document.addEventListener("DOMContentLoaded", () => {
  // The year range comes from the photos; the static text above is the fallback.
  const photos = window.FY_PHOTOS || [], years = photos.map((p) => p.date.slice(0, 4)).sort();
  if (!photos.length) return;
  const range = `${years[0]}–${years[years.length - 1]}`;
  document.querySelector("[data-photo-count]").textContent = `${photos.length} frames · ${range}`;
  document.querySelector('meta[name="description"]').setAttribute("content", `Fred Yang's photography archive, ${range}.`);
});
</script>
