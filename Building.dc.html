    .timeline-toolbar{padding-inline:15px}
    .board-viewport{padding-inline:15px;scroll-padding-inline:15px}
    .building-board-track{gap:36px;min-height:640px;padding-right:12px}
    .card-slot--highlighted{--tilt:-1.2deg;--drop:12px;width:84vw}
    .highlighted-card{min-height:540px;padding:30px 22px 26px}
    .highlighted-title{font-size:clamp(50px,18vw,74px)}
    .highlighted-note{font-size:16px}
    .highlighted-footer{display:block}
    .card-slot--featured{--tilt:1.8deg;--drop:76px;width:82vw;margin-left:0}
    .featured-card{min-height:390px;padding:28px 23px}
    .standard-card{width:min(190px,50vw)}
    .standard-card[data-project-id="tsugi"]{--tilt:-2.2deg;--drop:42px;margin-left:0}
    .standard-card[data-project-id="instant-bookmark"]{--tilt:2.35deg;--drop:126px;margin-left:0}
    .standard-card[data-project-id="wavelength"]{--tilt:-1.8deg;--drop:64px;margin-left:0}
    .standard-card h2{font-size:20px}
    .morph-toggle{width:30px;height:30px}
    .morph-panel{width:calc(100vw - 28px);max-height:calc(100vh - 28px)}
    .morph-panel-paper{padding:22px 23px 23px}
    .morph-panel p{font-size:14px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
    .br,.highlighted-title{animation:none!important;opacity:1!important}
  }
  @media(forced-colors:active){
    .highlighted-title{background:none;color:CanvasText;-webkit-text-fill-color:CanvasText}
    .project-card,.morph-toggle,.project-cta{border-color:CanvasText}
    .standard-card-paper{background:CanvasText;forced-color-adjust:none}
    .standard-card-paper-inner{background:Canvas;forced-color-adjust:none}
    .project-label-dot{background:CanvasText}
    .board-pin .pin-head{fill:CanvasText}
  }
</style>

<script>
(() => {
  const initializeBoard = () => {
    const projects = Array.isArray(window.BUILDING_PROJECTS)
      ? [...window.BUILDING_PROJECTS].sort((a, b) => {
          const leadDifference = Number(Boolean(b.boardLead)) - Number(Boolean(a.boardLead));
          return leadDifference || String(b.sortDate).localeCompare(String(a.sortDate)) || a.order - b.order;
        })
      : [];
    const board = document.querySelector("[data-building-board]");
    const viewport = document.querySelector("[data-building-board-viewport]");
    if (!projects.length) {
      console.error("Building project index is missing or empty.");
      return;
    }
    if (!board || !viewport || board.dataset.boardReady === "true") return;
    board.dataset.boardReady = "true";
    document.querySelectorAll(".morph-panel[data-building-panel]").forEach((panel) => panel.remove());

    const escapeHTML = (value) => String(value).replace(/[&<>'"]/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "'": "&#39;",
      "\"": "&quot;"
    })[character]);

    const label = (project) => project.prominence ? `
      <div class="project-label">
        <span class="project-label-dot" aria-hidden="true"></span>
        <strong>${escapeHTML(project.prominence)}</strong>
        <span>${escapeHTML(project.kind)}</span>
      </div>` : "";

    const githubMark = `
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M12 .7a11.6 11.6 0 0 0-3.67 22.6c.58.1.8-.25.8-.56v-2.25c-3.24.71-3.92-1.38-3.92-1.38-.53-1.36-1.3-1.72-1.3-1.72-1.06-.73.08-.72.08-.72 1.17.09 1.79 1.21 1.79 1.21 1.04 1.8 2.73 1.28 3.4.98.1-.76.4-1.28.74-1.57-2.59-.3-5.31-1.3-5.31-5.78 0-1.28.45-2.32 1.2-3.14-.12-.3-.52-1.49.12-3.1 0 0 .98-.32 3.2 1.2a11 11 0 0 1 5.83 0c2.22-1.52 3.2-1.2 3.2-1.2.64 1.61.24 2.8.12 3.1.75.82 1.2 1.86 1.2 3.14 0 4.5-2.73 5.47-5.33 5.77.42.37.79 1.09.79 2.2v3.26c0 .31.21.67.8.56A11.6 11.6 0 0 0 12 .7Z"/>
      </svg>`;

    const boardPin = `
      <svg class="board-pin" viewBox="0 0 20 42" aria-hidden="true" focusable="false">
        <ellipse class="pin-shadow" cx="10" cy="39" rx="5.5" ry="2.2"></ellipse>
        <path class="pin-stem" d="M10 37 L10 9"></path>
        <path class="pin-stem-glint" d="M9.2 37 L9.2 9"></path>
        <circle class="pin-head" cx="10" cy="8" r="8"></circle>
        <circle class="pin-glint" cx="7.3" cy="5.3" r="2.3"></circle>
      </svg>`;

    const renderHighlighted = (project) => {
      const slot = document.createElement("div");
      slot.className = "card-slot card-slot--highlighted";
      const card = document.createElement("a");
      card.className = "project-card highlighted-card";
      card.dataset.projectId = project.id;
      card.href = project.href;
      card.setAttribute("aria-label", `${project.title}: enter the field notes`);
      card.innerHTML = `
        ${label(project)}
        <h2 class="highlighted-title">${escapeHTML(project.title)}</h2>
        <p class="highlighted-note">${escapeHTML(project.note)}</p>
        <div class="project-meta"><span>${escapeHTML(project.lifecycle)}</span><span>${escapeHTML(project.period)}</span><span>updated ${escapeHTML(project.updated)}</span></div>
        <div class="highlighted-footer">
          <span class="project-cta">Enter the field notes</span>
        </div>`;
      slot.innerHTML = boardPin;
      slot.append(card);
      return slot;
    };

    const renderFeatured = (project) => {
      const slot = document.createElement("div");
      slot.className = "card-slot card-slot--featured";
      const card = document.createElement("a");
      card.className = "project-card featured-card";
      card.dataset.projectId = project.id;
      card.href = project.href;
      card.setAttribute("aria-label", `${project.title}: open the field studies`);
      card.innerHTML = `
        ${label(project)}
        <h2>${escapeHTML(project.title)}</h2>
        <p>${escapeHTML(project.note)}</p>
        <div class="featured-actions">
          <div class="project-meta"><span>${escapeHTML(project.lifecycle)}</span><span>${escapeHTML(project.period)}</span></div>
          <span class="featured-cta">Open field studies →</span>
        </div>`;
      slot.innerHTML = boardPin;
      slot.append(card);
      return slot;
    };

    const renderStandard = (project) => {
      const article = document.createElement("article");
      const titleId = `${project.id}-title`;
      const panelId = `${project.id}-panel`;
      article.className = "project-card standard-card";
      article.dataset.projectId = project.id;
      article.dataset.panelCard = "";
      article.dataset.open = "false";
      article.innerHTML = `
        ${boardPin}
        <div class="standard-card-paper">
          <div class="standard-card-paper-inner">
            <h2 id="${titleId}">${escapeHTML(project.title)}</h2>
            <p class="standard-period util">${escapeHTML(project.period)} · ${escapeHTML(project.lifecycle)}</p>
            <div class="project-actions">
              <a class="github-link github-link--card" href="${escapeHTML(project.repo)}" target="_blank" rel="noopener noreferrer" aria-label="Open ${escapeHTML(project.title)} on GitHub">${githubMark}<span>repo ↗</span></a>
              <button class="morph-toggle" type="button" aria-expanded="false" aria-controls="${panelId}" aria-label="Open ${escapeHTML(project.title)} details">
                <span class="morph-icon" aria-hidden="true"></span>
              </button>
            </div>
          </div>
        </div>
        <div class="morph-panel" id="${panelId}" data-building-panel data-project-id="${escapeHTML(project.id)}" role="region" aria-labelledby="${titleId}" aria-hidden="true" hidden>
          <div class="morph-panel-paper">
            <div class="morph-panel-heading">
              <span class="morph-panel-kicker">field note · ${String(project.order).padStart(2, "0")}</span>
            </div>
            <p>${escapeHTML(project.note)}</p>
            <a class="github-link github-link--panel" href="${escapeHTML(project.repo)}" target="_blank" rel="noopener noreferrer">${githubMark}<span>Open repository ↗</span></a>
          </div>
        </div>`;
      return article;
    };

    projects.forEach((project) => {
      if (project.prominence === "highlighted") board.append(renderHighlighted(project));
      else if (project.prominence === "featured") board.append(renderFeatured(project));
      else board.append(renderStandard(project));
    });

    board.querySelectorAll(".morph-panel[data-building-panel]").forEach((panel) => document.body.append(panel));
    document.querySelectorAll("[data-project-count]").forEach((node) => {
      node.textContent = `on the board · ${projects.length} 件`;
    });

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const closeTimers = new WeakMap();
    const panelFor = (card) => document.getElementById(card.querySelector(".morph-toggle").getAttribute("aria-controls"));
    const positionPanel = (card) => {
      const button = card.querySelector(".morph-toggle");
      const panel = panelFor(card);
      if (!button || !panel || panel.hidden) return;
      const margin = 14;
      const gap = 10;
      const buttonRect = button.getBoundingClientRect();
      const panelWidth = panel.offsetWidth;
      const panelHeight = panel.offsetHeight;
      const left = Math.min(Math.max(buttonRect.right - panelWidth, margin), window.innerWidth - panelWidth - margin);
      const below = buttonRect.bottom + gap;
      const above = buttonRect.top - panelHeight - gap;
      const opensBelow = below + panelHeight <= window.innerHeight - margin;
      const top = opensBelow
        ? below
        : Math.max(margin, Math.min(above, window.innerHeight - panelHeight - margin));
      panel.style.left = `${Math.round(left)}px`;
      panel.style.top = `${Math.round(top)}px`;
      panel.style.setProperty("--panel-origin-x", `${Math.round(buttonRect.left + buttonRect.width / 2 - left)}px`);
      panel.style.setProperty("--panel-origin-y", opensBelow ? "0px" : `${panelHeight}px`);
      panel.dataset.placement = opensBelow ? "below" : "above";
    };

    const setOpen = (card, shouldOpen, returnFocus = false) => {
      const button = card.querySelector(".morph-toggle");
      const panel = panelFor(card);
      if (!button || !panel) return;
      clearTimeout(closeTimers.get(panel));

      if (shouldOpen) {
        document.querySelectorAll('.project-card[data-panel-card][data-open="true"]').forEach((openCard) => {
          if (openCard !== card) setOpen(openCard, false);
        });
        panel.hidden = false;
        panel.dataset.open = "false";
        panel.setAttribute("aria-hidden", "false");
        button.setAttribute("aria-expanded", "true");
        button.setAttribute("aria-label", `Close ${card.querySelector("h2").textContent} details`);
        card.dataset.open = "true";
        positionPanel(card);
        void panel.offsetWidth;
        requestAnimationFrame(() => { panel.dataset.open = "true"; });
        return;
      }

      card.dataset.open = "false";
      panel.dataset.open = "false";
      panel.setAttribute("aria-hidden", "true");
      button.setAttribute("aria-expanded", "false");
      button.setAttribute("aria-label", `Open ${card.querySelector("h2").textContent} details`);
      const finishClose = () => { panel.hidden = true; };
      if (reducedMotion.matches) finishClose();
      else closeTimers.set(panel, setTimeout(finishClose, 350));
      if (returnFocus) button.focus();
    };

    const openCard = () => document.querySelector('.project-card[data-panel-card][data-open="true"]');
    board.addEventListener("click", (event) => {
      if (event.target.closest("a")) return;
      const card = event.target.closest(".project-card[data-panel-card]");
      if (!card) return;
      const button = card.querySelector(".morph-toggle");
      setOpen(card, button.getAttribute("aria-expanded") !== "true");
    });

    document.addEventListener("click", (event) => {
      const card = openCard();
      if (!card) return;
      const panel = panelFor(card);
      if (!card.contains(event.target) && !panel.contains(event.target)) setOpen(card, false);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      const card = openCard();
      if (card) setOpen(card, false, true);
    });

    const scrollButtons = Array.from(document.querySelectorAll("[data-board-scroll]"));
    const updateScrollButtons = () => {
      const max = Math.max(0, viewport.scrollWidth - viewport.clientWidth);
      scrollButtons.forEach((button) => {
        button.disabled = Number(button.dataset.boardScroll) < 0 ? viewport.scrollLeft <= 2 : viewport.scrollLeft >= max - 2;
      });
    };
    scrollButtons.forEach((button) => {
      button.addEventListener("click", () => {
        viewport.scrollBy({
          left: Number(button.dataset.boardScroll) * Math.max(280, viewport.clientWidth * .78),
          behavior: reducedMotion.matches ? "auto" : "smooth"
        });
      });
    });
    viewport.addEventListener("scroll", () => {
      updateScrollButtons();
      const card = openCard();
      if (card) positionPanel(card);
    }, { passive: true });
    window.addEventListener("resize", () => {
      updateScrollButtons();
      const card = openCard();
      if (card) positionPanel(card);
    });
    updateScrollButtons();
  };

  const observeRenderedPage = () => {
    initializeBoard();
    new MutationObserver(initializeBoard).observe(document.body, { childList: true, subtree: true });
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", observeRenderedPage, { once: true });
  else observeRenderedPage();
})();
</script>
