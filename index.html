<script type="text/x-dc" data-dc-script data-props="{&quot;opener&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;session&quot;,&quot;always&quot;,&quot;off&quot;],&quot;default&quot;:&quot;always&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;开场 opener&quot;}}">
class Component extends DCLogic {
  birdRef = React.createRef();
  lapRef = React.createRef();
  typeRef = React.createRef();
  frameRef = React.createRef();
  rootRef = React.createRef();
  openRef = React.createRef();
  componentDidMount() {
    this.apply(false);
    this._alive = true;
    var self = this;
    var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    // laptop: idle = blinking caret only; typing on hover (laptop or 在造 note)
    var typeEls = [this.lapRef.current].concat([].slice.call(document.querySelectorAll('.nav-build'))).filter(Boolean);
    typeEls.forEach(function (el) {
      el.addEventListener('mouseenter', function () { self.type(); });
      el.addEventListener('mouseleave', function () { self.stopType(); });
    });
    if (matchMedia('(hover: none)').matches) this._typeLoop = setInterval(function () { self.type(); }, 8000);
    // picture-frame expressions: 0 neutral · 1 blink · 2 smile · 3 surprised
    var setF = function (i) {
      var f = self.frameRef.current;
      if (f) f.querySelectorAll('.fframe').forEach(function (el) { el.style.backgroundPosition = (i * 100 / 3) + '% 0'; });
    };
    this._surprised = false;
    var blink = function () {
      if (!self._alive) return;
      self._blinkT = setTimeout(function () {
        if (self._alive && !self._surprised) {
          setF(1);
          setTimeout(function () { if (!self._surprised) setF(0); }, 170);
        }
        blink();
      }, 3200 + Math.random() * 3800);
    };
    if (!rm) blink();
    [].slice.call(document.querySelectorAll('.camwrap,.nav-shoot')).forEach(function (el) {
      el.addEventListener('mouseenter', function () {
        self._surprised = true; setF(3);
        clearTimeout(self._supT);
        self._supT = setTimeout(function () { self._surprised = false; setF(0); }, 900);
      });
    });
    if (!rm) this.birdLoop();
    // iris-in opener
    var mode = this.props.opener || 'session';
    var played = false;
    try { played = sessionStorage.getItem('fy-opener') === '1'; } catch (e) {}
    if (mode !== 'off' && !rm && (mode === 'always' || !played)) this.runOpener();
  }
  runOpener() {
    var self = this;
    var ov = this.openRef.current, root = this.rootRef.current, bird = this.birdRef.current;
    if (!ov || !root || !bird) return;
    root.classList.add('fy-hold');
    ov.style.display = 'block';
    var W = window.innerWidth, H = window.innerHeight;
    var hole = ov.querySelector('.ihole');
    hole.setAttribute('cx', W / 2); hole.setAttribute('cy', H / 2);
    var tag = ov.querySelector('[data-otag]');
    tag.animate([{ opacity: 0 }, { opacity: .9 }], { duration: 500, delay: 200, fill: 'forwards' });
    // Nichijou-style loading: a staggered line of birds hops across the bottom of the black screen.
    // Fully decoupled from the desk bird — no landing handoff to mismatch.
    var flock = ov.querySelector('[data-oflock]');
    flock.innerHTML = '';
    var groundY = H * .52;
    var sprites = [];
    var N = 5;
    for (var i = 0; i < N; i++) {
      var outer = document.createElement('div');
      outer.style.cssText = 'position:absolute;left:0;top:' + (groundY - 44) + 'px;width:46px;height:45px;will-change:transform';
      var inner = document.createElement('div');
      inner.style.cssText = 'width:100%;height:100%;transform:scaleX(-1);background-image:url(./assets/bird-strip6-dark.png);background-size:600% 100%;background-position:0 0;background-repeat:no-repeat';
      outer.appendChild(inner);
      flock.appendChild(outer);
      var D = 3400 + i * 120;                      // slight speed spread
      outer.animate([
        { transform: 'translateX(-70px)' },
        { transform: 'translateX(' + (W + 70) + 'px)' }
      ], { duration: D, delay: i * 300, easing: 'linear', fill: 'both' });
      // small hop bounce, phase-shifted per bird
      inner.animate([
        { marginTop: '0px' }, { marginTop: '-6px' }, { marginTop: '0px' }
      ], { duration: 360, delay: i * 90, iterations: Infinity, easing: 'ease-in-out' });
      sprites.push({ el: inner, phase: i });
    }
    // 6-frame hop cycle, phase-shifted so the line ripples
    var tick = 0;
    this._opFlap = setInterval(function () {
      tick++;
      sprites.forEach(function (s) {
        var f = (tick + s.phase) % 6;
        s.el.style.backgroundPosition = (f * 20) + '% 0';
      });
    }, 95);
    this._opT = [];
    this._opT.push(setTimeout(function () {
      var R = Math.hypot(W, H) * .8;
      hole.animate([{ r: '0px' }, { r: R + 'px' }], { duration: 1150, easing: 'cubic-bezier(.6,.05,.25,1)', fill: 'forwards' });
      tag.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 420, delay: 480, fill: 'forwards' });
      var ld = ov.querySelector('[data-oload]');
      if (ld) ld.animate([{ opacity: .75 }, { opacity: 0 }], { duration: 300, delay: 300, fill: 'forwards' });
      flock.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, delay: 500, fill: 'forwards' });
    }, 2050));
    this._opT.push(setTimeout(function () { self.endOpener(); }, 3400));
  }
  endOpener() {
    (this._opT || []).forEach(clearTimeout);
    clearInterval(this._opFlap);
    var ov = this.openRef.current, root = this.rootRef.current;
    if (ov) ov.style.display = 'none';
    if (root) root.classList.remove('fy-hold');
    try { sessionStorage.setItem('fy-opener', '1'); } catch (e) {}
  }
  componentWillUnmount() {
    this._alive = false;
    clearInterval(this._typer);
    clearInterval(this._typeLoop);
    clearTimeout(this._blinkT);
    clearTimeout(this._supT);
    (this._opT || []).forEach(clearTimeout);
    clearInterval(this._opFlap);
  }
  stopType() {
    clearInterval(this._typer);
    var el = this.typeRef.current;
    if (el) el.textContent = '';
  }
  type() {
    var el = this.typeRef.current;
    if (!el) return;
    clearInterval(this._typer);
    var txt = '$ make life\n> building agents…\n> writing essays…';
    var i = 0;
    el.textContent = '';
    this._typer = setInterval(() => {
      i++;
      el.textContent = txt.slice(0, i);
      if (i >= txt.length) clearInterval(this._typer);
    }, 70);
  }
  birdLoop() {
    var bird = this.birdRef.current;
    if (!bird) return;
    var frames = bird.querySelectorAll('.bframe');
    var setF = function (i) { frames.forEach(function (f) { f.style.backgroundPosition = (i * 20) + '% 0'; }); };
    var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
    var self = this, x = 14, dir = -1;
    (async function () {
      await sleep(2000);
      while (self._alive) {
        await sleep(500 + Math.random() * 1200);
        if (x < 8) dir = 1; else if (x > 24) dir = -1; else if (Math.random() < .45) dir = -dir;
        bird.style.transform = dir > 0 ? 'scaleX(-1)' : '';
        var hops = 2 + Math.floor(Math.random() * 3);
        for (var h = 0; h < hops && self._alive; h++) {
          var seq = [[1, 90, 0], [2, 95, .3], [3, 105, .4], [4, 90, .3], [5, 70, 0], [0, 90, 0]];
          for (var s = 0; s < seq.length; s++) {
            setF(seq[s][0]);
            x += seq[s][2] * 1.5 * dir;
            bird.style.left = x + '%';
            await sleep(seq[s][1]);
          }
          await sleep(130);
        }
      }
    })();
  }
  componentDidUpdate(prevProps) {
    if (prevProps.lang !== this.props.lang) {
      this.apply(true);
    }
  }
  apply(fromTweaks) {
    var r = document.documentElement;
    var l = fromTweaks ? (this.props.lang || 'zh') : (localStorage.getItem('fy-lang') || this.props.lang || 'zh');
    r.classList.toggle('lang-zh', l === 'zh');
    r.classList.toggle('lang-en', l !== 'zh');
    r.classList.remove('dark');
    r.setAttribute('lang', l);
    if (fromTweaks) {
      localStorage.setItem('fy-lang', l);
    }
  }
  renderVals() {
    return {
      birdRef: this.birdRef,
      lapRef: this.lapRef,
      typeRef: this.typeRef,
      frameRef: this.frameRef,
      rootRef: this.rootRef,
      openRef: this.openRef,
      skipOpener: () => this.endOpener(),
      toggleLang: () => {},
      toggleTheme: () => {}
    };
  }
}
</script>
