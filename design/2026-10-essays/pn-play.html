<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The end of an essay · 2026-10 · try it</title>
<link rel="icon" href="../../favicon.png" type="image/png" sizes="512x512">
<link rel="stylesheet" href="../../lib/shared/site-tokens.css">
<style>
/* The real Reading page fills the window (resize the window to try the phone width); the bar picks the ending. */
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper)}
iframe{display:block;width:100%;height:100%;border:0}
.bar{position:fixed;left:10px;bottom:10px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;max-width:calc(100% - 20px);box-sizing:border-box;
  padding:5px 7px;background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;box-shadow:0 6px 18px rgba(60,50,35,.14);font:11px/1 var(--util);color:var(--soft)}
.g{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.k{margin-right:3px;color:var(--pencil)}
.bar button,.bar a{padding:6px 7px;border:1px solid transparent;border-radius:3px;background:none;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.bar button:hover,.bar a:hover{border-color:var(--line-strong)}
.bar button[aria-pressed="true"]{background:var(--hl);border-color:var(--hl-ink)}
.bar button:focus-visible,.bar a:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.bar.min .g:not(.keep){display:none}
</style>
</head>
<body>
<iframe id="f" title="Reading, with the ending you picked"></iframe>
<div class="bar" role="toolbar" aria-label="Pick an ending">
  <div class="g"><span class="k">ending</span><button type="button" data-c="now">now</button><button type="button" data-c="a">A 书架</button><button type="button" data-c="b">B 拿在手里</button><button type="button" data-c="c">C 铅笔线</button></div>
  <div class="g"><span class="k">essay</span><button type="button" data-p="mid">middle</button><button type="button" data-p="newest">newest</button><button type="button" data-p="oldest">oldest</button></div>
  <div class="g keep"><button type="button" data-act="end">↓ end</button><a href="./pn-index.html">☰ board</a><button type="button" data-act="min" aria-label="Fold or unfold the bar">–</button></div>
</div>
<script type="module">
import { inject, ready } from './pn-inject.js';
const CASES = { mid: '2025-03-23_hawaii-has-no-anger', newest: '2026-08-29_google-just-wants-to-coast-to-a-win', oldest: '2015-04-12_notes-on-resurrection-time-and-life-in-flow-and-superposition' };
const q = new URLSearchParams(location.search), f = document.getElementById('f'), bar = document.querySelector('.bar');
let c = q.get('c') || 'a', post = q.get('post') || CASES[q.get('case')] || CASES.mid, toEnd = q.get('end') !== '0';

function sync() {
  const u = new URL(location.href); u.searchParams.set('c', c); u.searchParams.set('post', post); u.searchParams.delete('case'); u.searchParams.delete('end');
  history.replaceState(null, '', u);
  bar.querySelectorAll('[data-c]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.c === c)));
  bar.querySelectorAll('[data-p]').forEach((b) => b.setAttribute('aria-pressed', String(CASES[b.dataset.p] === post)));
}
function end() { const w = f.contentWindow; w.scrollTo({ top: w.document.documentElement.scrollHeight, behavior: 'instant' }); }
function open(p, e) { post = p; toEnd = e !== false; f.src = '../../Reading.dc.html?post=' + encodeURIComponent(p); sync(); }

f.addEventListener('load', async () => {
  const p = new URLSearchParams(f.contentWindow.location.search).get('post');   // a neighbour opened inside the frame
  if (p) post = p;
  sync();
  if (!inject(f, c)) return;
  await ready(f);
  if (toEnd) { toEnd = false; end(); }
});
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.c) { c = b.dataset.c; inject(f, c); sync(); }
  else if (b.dataset.p) open(CASES[b.dataset.p]);
  else if (b.dataset.act === 'end') end();
  else if (b.dataset.act === 'min') { bar.classList.toggle('min'); b.textContent = bar.classList.contains('min') ? '+' : '–'; }
});
open(post, toEnd);
</script>
</body>
</html>
