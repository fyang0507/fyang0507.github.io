<script>
  // Decide before first paint so a playing opener never flashes the desk underneath it.
  (function () {
    var q = new URLSearchParams(location.search), h = document.documentElement, rm = false;
    try { rm = sessionStorage.getItem('mock-rm') === '1'; } catch (e) {}
    if (rm) h.classList.add('rm');
    rm = rm || matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!rm && q.get('autoplay') !== '0') h.classList.add('oc-on');
    if (q.get('ctl') === '0') h.classList.add('no-ctl');
  })();
</script>
