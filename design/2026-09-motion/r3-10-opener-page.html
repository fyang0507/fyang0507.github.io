<script>
  // Decide before first paint, so a playing opener never flashes the desk underneath it and a returning run never
  // flashes the OP's first field. "Returning" is this browser session only (sessionStorage), like today's live
  // opener; ?mode=first|returning overrides it for the board. No localStorage.
  (function () {
    var q = new URLSearchParams(location.search), h = document.documentElement, rm = false, seen = false;
    try { rm = sessionStorage.getItem('mock-rm') === '1'; seen = sessionStorage.getItem('fy-opener-r3') === '1'; } catch (e) {}
    if (rm) h.classList.add('rm');
    rm = rm || matchMedia('(prefers-reduced-motion: reduce)').matches;
    var m = /^(first|returning)$/.test(q.get('mode')) ? q.get('mode') : seen ? 'returning' : 'first';
    h.dataset.mode = m;
    if (m === 'returning') h.classList.add('ret');
    if (!rm && q.get('autoplay') !== '0') h.classList.add('opening');
    if (q.get('ctl') === '0') h.classList.add('no-ctl');
  })();
</script>
