<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Video chrome, rendered to PNG layers by compose.mjs (the system ffmpeg has no drawtext).
     ?kind=card → a full-frame title card. ?kind=split&layer=base|top|cap → background + header + labels (bl/al name the sides),
     pane frames drawn over the video, or one beat's captions (transparent layers). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=block" rel="stylesheet">
<style>
  @font-face{font-family:"JinBuTi";src:url("http://127.0.0.1:4214/fonts/DingTalkJinBuTi.woff2") format("woff2");font-display:block}
  :root{--paper:#FBF6EC;--paper2:#F3ECDD;--ink:#33302B;--soft:#5E574D;--pencil:#7A7063;--mark:#D9695A;--line:#E4DAC7}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper2);color:var(--ink);font-family:"Fraunces","Noto Serif SC",serif}
  html.clear,html.clear body{background:transparent}
  b{font-weight:500;color:var(--ink)}

  .card{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;justify-content:center;padding-left:260px}
  .card .k{font:500 19px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;color:var(--pencil);text-transform:uppercase}
  .card h1{margin-top:34px;font:500 96px/1.04 "Fraunces",serif;letter-spacing:-.018em}
  .card h1 em{font-style:normal;color:var(--mark)}
  .card .zh{margin-top:26px;font:400 50px/1.2 "JinBuTi",serif;color:var(--soft);letter-spacing:.04em}
  .card .rule{position:relative;width:132px;height:2.4px;background:var(--ink);margin-top:44px}
  .card .rule.perch{margin-top:112px}
  .card .bird{position:absolute;right:4px;bottom:calc(100% - 6px);width:78px;height:76px;background:url("http://127.0.0.1:4214/assets/bird-strip-light.png") 100% 0/200% 100% no-repeat}
  .card p{margin-top:40px;max-width:1300px;font:400 31px/1.5 "Fraunces",serif;color:var(--soft)}
  .card p .pzh{display:block;margin-top:10px;font:400 25px/1.55 "Noto Serif SC",serif;color:var(--pencil)}
  .card .foot{position:absolute;left:260px;bottom:96px;font:400 26px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--ink)}
  .card .foot b{color:var(--ink)}

  .head{position:absolute;left:36px;right:36px;top:36px;height:66px;display:flex;align-items:baseline;gap:22px;border-bottom:1.5px solid var(--ink)}
  .head .n{font:500 19px/1 "IBM Plex Mono",monospace;color:var(--mark);letter-spacing:.1em}
  .head h2{font:500 44px/1 "Fraunces",serif;letter-spacing:-.01em}
  .head .zh{font:400 32px/1 "JinBuTi",serif;color:var(--soft);letter-spacing:.03em}
  .head .site{margin-left:auto;font:400 17px/1 "IBM Plex Mono",monospace;color:var(--pencil);letter-spacing:.06em}
  .lab{position:absolute;font:500 16px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;color:var(--pencil)}
  .lab b{letter-spacing:.14em}
  .lab.after b{color:var(--mark)}

  .clip{position:absolute;overflow:hidden}
  .frame{position:absolute;border:1.5px solid var(--ink);border-radius:6px;box-shadow:0 0 0 40px var(--paper2)}
  .phone .frame{border-width:2px;border-radius:30px}

  .cap{position:absolute;font:400 25px/1.42 "Fraunces",serif;color:var(--soft)}
  .cap .czh{display:block;margin-top:8px;font:400 21px/1.5 "Noto Serif SC",serif;color:var(--pencil)}
  .phone .cap.b{text-align:right}
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<em>$1</em>');
  const kind = q.get('kind') || 'split', layer = q.get('layer') || 'base';
  const G = JSON.parse(q.get('geo') || '{}');
  const px = (o) => Object.entries(o).map(([k, v]) => `${k}:${v}px`).join(';');
  let html = '';
  if (kind === 'card') {
    html = `<div class="card"><div class="k">${esc(q.get('k'))}</div><h1>${md(q.get('title'))}</h1>` +
      (q.get('zh') ? `<div class="zh">${esc(q.get('zh'))}</div>` : '') + (q.get('bird') ? '<div class="rule perch"><i class="bird"></i></div>' : '<div class="rule"></div>') +
      `<p>${md(q.get('cap'))}<span class="pzh">${esc(q.get('capzh'))}</span></p>` +
      (q.get('foot') ? `<div class="foot">${md(q.get('foot'))}</div>` : '') + `</div>`;
  } else {
    document.body.className = G.mode;
    const [b, a] = G.panes;
    if (layer === 'base') {
      html = `<div class="head"><span class="n">${esc(q.get('n'))}</span><h2>${esc(q.get('title'))}</h2><span class="zh">${esc(q.get('zh'))}</span><span class="site">fyang0507.github.io</span></div>
        <div class="lab" style="${px({ left: b.x, top: b.y - 30 })}"><b>BEFORE</b> · ${esc(q.get('note') || q.get('bl') || 'the site today')}</div>
        <div class="lab after" style="${px({ left: a.x, top: a.y - 30 })}"><b>AFTER</b> · ${esc(q.get('note') || q.get('al') || 'the redesign')}</div>`;
    } else if (layer === 'top') {
      document.documentElement.className = 'clear';
      const bw = G.mode === 'phone' ? 2 : 1.5, pad = 12;
      html = [b, a].map(p => `<div class="clip" style="${px({ left: p.x - pad, top: p.y - pad, width: p.w + 2 * pad, height: p.h + 2 * pad })}"><div class="frame" style="${px({ left: pad - bw, top: pad - bw, width: p.w + 2 * bw, height: p.h + 2 * bw })}"></div></div>`).join('');
    } else {
      document.documentElement.className = 'clear';
      const c = G.cap;
      const col = (p, side) => G.mode === 'phone'
        ? (side === 'b' ? { left: 36, top: c.y, width: p.x - 36 - 44 } : { left: p.x + p.w + 44, top: c.y, width: 1884 - (p.x + p.w + 44) })
        : { left: p.x, top: c.y, width: p.w - 20 };
      const one = (side, p) => `<div class="cap ${side}" style="${px(col(p, side))}">${md(q.get(side))}<span class="czh">${esc(q.get(side + 'zh'))}</span></div>`;
      html = one('b', b) + one('a', a);
    }
  }
  document.body.innerHTML = html;
  const art = q.get('bird') ? new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = 'http://127.0.0.1:4214/assets/bird-strip-light.png'; }) : null;
  Promise.all([document.fonts.ready, art]).then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
